
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Search Fund Test
    </title>


    <style>

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            margin: 0;

            padding: 30px;

            background: #f5f6f8;

            color: #222;
        }


        .container {

            max-width: 1200px;

            margin: auto;
        }


        h1 {

            margin-bottom: 5px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }


        .summary {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap: 15px;

            margin-bottom: 30px;
        }


        .card {

            background: white;

            padding: 20px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        .card h3 {

            margin: 0 0 10px 0;

            font-size: 14px;

            color: #666;
        }


        .card .value {

            font-size: 28px;

            font-weight: bold;
        }


        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 12px;

            font-size: 12px;

            font-weight: bold;
        }


        .passed {

            background: #d4edda;

            color: #155724;
        }


        .failed {

            background: #f8d7da;

            color: #721c24;
        }


        .not-started {

            background: #e2e3e5;

            color: #383d41;
        }


        .report-info {

            background: white;

            padding: 20px;

            border-radius: 8px;

            margin-bottom: 30px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        .report-info p {

            margin: 8px 0;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            background: white;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        th,
        td {

            padding: 12px;

            text-align: left;

            border-bottom:
                1px solid #ddd;

            vertical-align: top;
        }


        th {

            background: #f0f1f3;
        }


        tr:hover {

            background: #f9f9f9;
        }


        .error {

            max-width: 400px;

            word-break: break-word;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Search Fund Test
    </h1>

    <div class="subtitle">
        ORCA Mobile Automation Test Report
    </div>


    <div class="summary">

        <div class="card">

            <h3>Overall Status</h3>

            <div>
                <span class="status passed">
                    PASSED
                </span>
            </div>

        </div>


        <div class="card">

            <h3>Total Funds</h3>

            <div class="value">
                1
            </div>

        </div>


        <div class="card">

            <h3>Passed</h3>

            <div class="value">
                1
            </div>

        </div>


        <div class="card">

            <h3>Failed</h3>

            <div class="value">
                0
            </div>

        </div>

    </div>


    <div class="report-info">

        <p>
            <strong>Start Time:</strong>
            10/23/2026, 5:25:24 PM
        </p>

        <p>
            <strong>End Time:</strong>
            10/23/2026, 5:25:44 PM
        </p>

    </div>


    <table>

        <thead>

            <tr>

                <th>#</th>

                <th>Fund Name</th>

                <th>Status</th>

                <th>Failed Section</th>

                <th>Error</th>

            </tr>

        </thead>


        <tbody>

            
                        <tr>
                            <td>1</td>

                            <td>
                                HDFC Flexi Cap Fund
Type -
Equity
AUM -
1,08,546.98 crs.
                            </td>

                            <td>
                                <span class="status passed">
                                    PASSED
                                </span>
                            </td>

                            <td>
                                -
                            </td>

                            <td>
                                -
                            </td>
                        </tr>
                    

        </tbody>

    </table>

</div>

</body>

</html>
